# Конфигурация nginx для контейнерного frontend.
#
# Задачи:
#   1) раздавать собранный Vite-бандл из /usr/share/nginx/html;
#   2) проксировать /api на контейнер backend (единый origin для браузера —
#      CORS не требуется, относительные пути API работают как в dev-режиме);
#   3) поддерживать клиентскую маршрутизацию: любой неизвестный путь
#      отдаёт index.html, иначе перезагрузка страницы даёт 404.
#
# Плейсхолдер __NGINX_RESOLVER__ подставляет точка входа контейнера
# (app/frontend/docker-entrypoint.sh) из /etc/resolv.conf: адрес DNS-сервера
# в compose-сети Podman не фиксирован.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Адрес DNS-сервера подставляется при старте контейнера
    resolver __NGINX_RESOLVER__ ipv6=off valid=10s;
    set $backend_upstream http://backend:8000;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Статика со сборочным хешем в имени — кэшируем надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API-запросы к backend
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Проверка готовности backend
    location = /health {
        proxy_pass $backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Клиентская маршрутизация: /app/products/... должен открывать index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируем — иначе после обновления останется старая версия
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
